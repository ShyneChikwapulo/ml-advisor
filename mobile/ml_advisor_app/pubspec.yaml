name: ml_advisor_app 
description: ML Advisor - Model Selection for Bug Prediction 
publish_to: 'none' 
version: 1.0.0+1 
 
environment: 
  sdk: '>=3.0.0 <4.0.0' 
 
dependencies: 
  flutter: 
    sdk: flutter 
   
  # Firebase 
  firebase_core: ^2.24.2 
  firebase_auth: ^4.16.0 
  cloud_firestore: ^4.14.0 
   
  # State Management 
  provider: ^6.1.1 
   
  # HTTP 
  http: ^1.2.0 
   
  # Charts 
  fl_chart: ^0.66.2 
   
  # UI 
  cupertino_icons: ^1.0.6 
  google_fonts: ^6.1.0 
  cached_network_image: ^3.3.1 
  shimmer: ^3.0.0 
   
  # Storage 
  shared_preferences: ^2.2.2 
   
  # Utils 
  intl: ^0.19.0 
  uuid: ^4.3.3 
 
dev_dependencies: 
  flutter_test: 
    sdk: flutter 
  flutter_lints: ^3.0.0 
 
flutter: 
  uses-material-design: true 
  assets: 
    - assets/images/