name: ml_advisor_app 
description: ML Advisor - Model Selection for Bug Prediction 
publish_to: 'none' 
version: 1.0.0+1 
 
environment: 
  sdk: '>=3.0.0 <4.0.0' 
 
dependencies: 
  flutter: 
    sdk: flutter 
   
  # Firebase 
  firebase_core: ^3.13.0 
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.1
   
  # State Management 
  provider: ^6.1.5+1 
   
  # HTTP 
  http: ^1.2.0 
   
  # Charts 
  fl_chart: ^0.66.2 
   
  # UI 
  cupertino_icons: ^1.0.6 
  google_fonts: ^8.1.0 
  cached_network_image: ^3.3.1 
  shimmer: ^3.0.0 
   
  # Storage 
  shared_preferences: ^2.2.2 
   
  # Utils 
  intl: ^0.19.0 
  uuid: ^4.3.3 
  google_sign_in: ^7.2.0
 
dev_dependencies: 
  flutter_test: 
    sdk: flutter 
  flutter_lints: ^3.0.0 
 
flutter: 
  uses-material-design: true 
  assets: 
    - assets/images/browse_bg.jpg
    - assets/images/compare_bg.jpg
    - assets/images/favorites_bg.jpg
    - assets/images/research_bg.jpg
    - assets/images/avatars/
    - assets/images/Logo/
    - assets/images/OnBoarding.jpg